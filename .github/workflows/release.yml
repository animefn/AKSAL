# Builds native Windows and Linux distributions and publishes them together.
#
# To cut a release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag drives the embedded version, archive names, and release name. A
# manual dispatch runs the same builds as a dry run but never publishes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for dry-run artifacts"
        required: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (locked, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .
          pip install pyinstaller==6.22.0

      - name: Tests
        run: pytest -q

      - name: Build and smoke-test native executable
        env:
          AKSAL_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: python packaging/build.py

      - name: Archive
        shell: pwsh
        run: |
          $label = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($label)) {
            $label = "${{ github.ref_name }}"
          }
          $label = $label -replace '[^A-Za-z0-9._-]', '-'
          $archive = "aksal-$label-windows-x64.zip"
          Compress-Archive -Path dist/aksal/* -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "$archive.sha256" -NoNewline -Encoding ascii
          Get-Item $archive | Select-Object Name, @{n="MB";e={[int]($_.Length/1MB)}}

      - uses: actions/upload-artifact@v7
        with:
          name: aksal-windows-x64
          path: |
            aksal-*-windows-x64.zip
            aksal-*-windows-x64.zip.sha256
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (locked, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .

      - name: Tests
        run: pytest -q

      - name: Static check
        run: pyflakes src/aksal tests packaging

      - name: Build and smoke-test native executable
        env:
          AKSAL_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: python packaging/build.py

      - name: Archive
        shell: bash
        run: |
          label="${{ inputs.tag }}"
          if [[ -z "$label" ]]; then
            label="${GITHUB_REF_NAME}"
          fi
          label="$(printf '%s' "$label" | sed 's/[^A-Za-z0-9._-]/-/g')"
          archive="aksal-$label-linux-x64.tar.gz"
          tar -C dist -czf "$archive" aksal
          sha256sum "$archive" > "$archive.sha256"
          ls -lh "$archive" "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: aksal-linux-x64
          path: |
            aksal-*-linux-x64.tar.gz
            aksal-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: aksal-*-x64
          path: release-assets
          merge-multiple: true

      - name: Publish Windows and Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=$(cat <<'EOF'
          Native x64 builds for Windows and Linux.

          On Windows, unzip the archive and run `aksal.exe`. On Linux, extract
          the tarball and run `aksal`. Keep the `_internal` directory beside
          the executable on both systems. You may add the extracted directory
          to `PATH`.

          Acoustic and Demucs models download into the visible `models`
          directory beside the executable on first use and survive updates.
          FFmpeg is required and yt-dlp is optional; AKSAL offers to fetch
          either when it is missing.

          See USAGE.md for the four workflows.
          EOF
          )
          gh release create "$tag" \
            "release-assets/aksal-$tag-windows-x64.zip" \
            "release-assets/aksal-$tag-windows-x64.zip.sha256" \
            "release-assets/aksal-$tag-linux-x64.tar.gz" \
            "release-assets/aksal-$tag-linux-x64.tar.gz.sha256" \
            --verify-tag --title "AKSAL $tag" --notes "$notes"
