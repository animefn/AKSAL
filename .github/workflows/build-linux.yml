# Native Linux artifact build. Manual only: it uploads a tested artifact but
# never creates a tag or release.
name: build-linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (locked, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .

      - name: Tests
        run: pytest -q

      - name: Static check
        run: pyflakes src/aksal tests packaging

      - name: Build and smoke-test native executable
        run: python packaging/build.py

      - name: Archive (preserves executable permissions)
        run: |
          tar -C dist -czf "aksal-${GITHUB_SHA::12}-linux-x64.tar.gz" aksal
          ls -lh aksal-*-linux-x64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: aksal-linux-x64
          path: aksal-*-linux-x64.tar.gz
          if-no-files-found: error
