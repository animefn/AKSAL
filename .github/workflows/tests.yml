# Runs on every push. Cheap insurance: a syntax error once sat in cli.py while
# the whole suite passed locally, because nothing imported it -- and the only
# reason it was caught was that the next command happened to fail.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04         # also the oldest supported Linux build base
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (locked, CPU torch)
        # requirements.lock pins the whole tree, so a build months from now
        # installs what today's build did rather than what the resolver picks.
        # The CPU index is still needed or pip fetches several GB of unused CUDA.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .

      - name: Tests
        run: pytest -q

      - name: Static check
        run: pyflakes src/aksal tests    # pyflakes is in the lock
