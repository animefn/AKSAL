[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aksal"
version = "0.1.0"
description = "AFN Karaoke Syllable Aligner for Lyrics: two-phase karaoke timing from a song and its lyrics"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["karaoke", "subtitles", "anime", "fansub", "forced-alignment", "romaji", "japanese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    # Imported directly to fetch the acoustic model on first run. It arrives
    # via transformers anyway, but a direct import belongs in the manifest.
    "huggingface-hub>=0.23",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    # A second opinion for compound nouns. unidic-lite has the better grammar,
    # but splits set-phrase compounds and gets their READING wrong; ipadic
    # knows many of them as single entries.
    "ipadic>=1.0.0",
    "jaconv>=0.3",
]

[project.optional-dependencies]
# Vocal separation. Measured across eight songs against hand-timed karaoke it
# is a wash for syllable timing -- marginally better on average, worse in the
# tail -- for about four times the runtime, so it is opt-in rather than
# required. It also pulls in a large dependency tree of its own.
separate = ["demucs>=4.0"]
# Only `aksal find` uses it, and only to fetch a reference track. A packaged
# build can download the standalone binary at runtime instead.
fetch = ["yt-dlp>=2024.1.1"]
dev = ["pytest>=8.0"]
all = ["aksal[separate,fetch]"]

[project.urls]
Homepage = "https://github.com/animefn/AKSAL"
Repository = "https://github.com/animefn/AKSAL"
Issues = "https://github.com/animefn/AKSAL/issues"

[project.scripts]
aksal = "aksal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
