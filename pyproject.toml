[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aksal"
version = "0.1.0"
description = "AFN Karaoke Syllable Aligner for Lyrics: two-phase karaoke timing from a song and its lyrics"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["karaoke", "subtitles", "anime", "fansub", "forced-alignment", "romaji", "japanese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Text Processing :: Linguistic",
]
# Pinned exactly, because this is an application rather than a library: nothing
# depends on AKSAL, so there is no one for a loose range to be compatible WITH,
# and the accuracy figures in the README were measured against these versions.
# A release built six months from now should behave the way this one does.
#
# torch and torchaudio must come from the CPU index or pip installs several GB
# of CUDA that is never used:
#
#     pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
#     pip install -e .
#
# The +cpu local version is deliberately NOT part of the pin -- it would make
# the manifest unsatisfiable on any platform without a CPU-suffixed wheel.
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "soundfile==0.13.1",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "transformers==4.57.3",
    # Imported directly to fetch the acoustic model on first run. It arrives
    # via transformers anyway, but a direct import belongs in the manifest.
    "huggingface-hub==0.36.0",
    "fugashi==1.5.2",
    "unidic-lite==1.0.8",
    # A second opinion for compound nouns. unidic-lite has the better grammar,
    # but splits set-phrase compounds and gets their READING wrong; ipadic
    # knows many of them as single entries.
    "ipadic==1.0.0",
    "jaconv==0.4.1",
]

[project.optional-dependencies]
# Vocal separation. Measured across eight songs against hand-timed karaoke it
# is a wash for syllable timing -- marginally better on average, worse in the
# tail -- for about four times the runtime, so it is opt-in rather than
# required. It also pulls in a large dependency tree of its own.
separate = ["demucs==4.1.0"]
# yt-dlp is the ONE dependency deliberately left unpinned. It breaks against
# YouTube regularly and is fixed by updating, so a pin here would guarantee a
# stale copy. The tool never auto-updates it either -- changing itself mid-run
# would change results without anyone asking -- but it should be free to be
# current when installed.
fetch = ["yt-dlp"]
dev = ["pytest==9.1.1", "pyflakes", "pyinstaller==6.22.0"]
all = ["aksal[separate,fetch]"]

[project.urls]
Homepage = "https://github.com/animefn/AKSAL"
Repository = "https://github.com/animefn/AKSAL"
Issues = "https://github.com/animefn/AKSAL/issues"

[project.scripts]
aksal = "aksal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
